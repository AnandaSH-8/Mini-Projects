<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>XOrder Summary</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="main">
      <div class="container">
        <img src="./images/illustration-hero.svg" alt="Music illustration" />

        <div class="content">
          <h1 class="heading">Order Summary</h1>

          <p class="summary-para">
            You can now listen to millions of songs, audiobooks, and podcasts on
            any device anywhere you like!
          </p>

          <div class="plan">
            <img class="plan-icon" src="./images/icon-music.svg" alt="music" />

            <div class="plan-text">
              <h3>Annual Plan</h3>
              <p>$59.99/year</p>
            </div>

            <div class="change-link">
              <a href="#">Change</a>
            </div>
          </div>

          <button class="proceed-btn" type="button">Proceed to Payment</button>

          <a href="#" class="cancel-order">Cancel Order</a>
        </div>
      </div>

      <p class="footer">
        Challenge by <a href="https://www.crio.do">Crio.do</a>. Coded by
        <a href="#">Ananda S Holla</a>.
      </p>
    </main>
  </body>
</html>
